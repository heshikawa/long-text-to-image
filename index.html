<body>
  <header class="top">
    <div class="brand"><span class="mark" id="brandMark">T</span><div><b id="brandTitle">Long Text &middot; Image Layout</b><small id="brandSubtitle">Turn long text into clean, shareable images</small></div></div>
    <div class="actions">
      <div class="switch lang-switch" id="langSwitch"><button data-lang="zh">&#20013;&#25991;</button><button data-lang="en">EN</button></div>
      <button class="btn" id="importBtn">Import TXT</button><input id="file" type="file" accept=".txt,text/plain" hidden>
      <button class="btn" id="batchBtn">Export ZIP</button><button class="btn primary" id="longBtn">Export Long Image &nearr;</button>
    </div>
  </header>
  <main class="layout">
    <aside class="editor">
      <div class="heading"><div><span class="eyebrow" id="contentEyebrow">CONTENT</span><h1 id="editHeading">Edit Content</h1></div><span class="saved" id="savedText">&bull; Auto-saved</span></div>
      <label class="label" for="title" id="titleLabel">Title</label><input class="input" id="title" maxlength="50" value="" placeholder="Enter a title">
      <div class="body-row"><label class="label" for="text" id="textLabel">Text</label><span class="count" id="count"></span></div><textarea class="body" id="text" placeholder="Enter or paste your text here..."></textarea>
      <div class="section"><span class="label" id="paperStyleLabel">Paper Style</span><div class="themes" id="themes"></div></div>
      <div class="ranges"><label><span><b id="fontSizeLabel">Font Size</b><em id="fontVal">40</em></span><input id="font" type="range" min="32" max="52" step="2" value="40"></label><label><span><b id="lineSpacingLabel">Line Spacing</b><em id="lineVal">1.9</em></span><input id="line" type="range" min="1.5" max="2.3" step="0.1" value="1.9"></label></div>
      <label class="page-setting" for="pageCount"><span><b id="pageCountLabel">Page Count</b><small id="pageHint">Choose from 1-50 pages</small></span><span class="page-input"><input id="pageCount" type="number" min="1" max="50" step="1" value="3"><i id="pageUnit">pages</i></span></label>
      <div class="notice" id="notice">Processed locally in your browser &middot; nothing is uploaded</div>
    </aside>
    <section class="preview">
      <div class="preview-head"><div><span class="eyebrow" id="previewEyebrow">PREVIEW</span><h2 id="previewHeading">Live Preview</h2></div><div class="preview-controls"><button class="btn" id="pagesBtn">Download Current Page</button><div class="switch view-switch"><button class="active" data-view="long" id="longViewBtn">Long Image</button><button data-view="pages" id="pagesViewBtn">Pages</button></div></div></div>
      <div class="stage" id="stage"><article class="paper" id="paper" data-theme="garden"><div class="orn">&#9670;</div><p class="kicker" id="previewKicker">TEXT &middot; LAYOUT</p><h3 id="previewTitle"></h3><div class="rule"><i></i></div><div class="story" id="story"></div><footer><span id="previewFooter">Long Text &middot; Image Layout</span><span id="pageNo">&#10086;</span></footer></article></div>
      <nav class="pager" id="pager"><button id="prev">&larr; Previous</button><span id="pageStat"></span><button id="next">Next &rarr;</button></nav>
    </section>
  </main>

    function escapeText(text){return text.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
    function saveState(){localStorage.setItem('changtu-html',JSON.stringify({title:$('title').value,text:$('text').value,font:+$('font').value,line:+$('line').value,theme,pageCount:wantedPages(),lang}))}
    function update(){const s=tr(),title=$('title').value,text=$('text').value,font=+$('font').value,line=+$('line').value,layout=layoutText(text);pages=layout.chunks;page=Math.min(page,pages.length-1);$('fontVal').textContent=font;$('lineVal').textContent=line.toFixed(1);$('count').textContent=s.count(text.replace(/\s/g,'').length,pages.length);$('previewTitle').textContent=title||s.untitled;if(view==='pages'){$('story').innerHTML=pages[page].map(row=>`<div class="preview-line">${row?escapeText(row):'&nbsp;'}</div>`).join('')}else{$('story').innerHTML=text.replace(/\r/g,'').split(/\n+/).filter(Boolean).map(p=>`<p>${escapeText(p)}</p>`).join('')}$('paper').dataset.theme=theme;$('paper').style.setProperty('--size',font/2+'px');$('paper').style.setProperty('--leading',line);$('paper').style.setProperty('--page-height',Math.max(790,layout.pageHeight/2+55)+'px');$('paper').classList.toggle('page',view==='pages');document.documentElement.style.setProperty('--stage',THEMES[theme].canvas);$('pageNo').textContent=view==='pages'?`${String(page+1).padStart(2,'0')} / ${String(pages.length).padStart(2,'0')}`:'\u2766';$('pageStat').textContent=`${page+1} / ${pages.length}`;$('prev').disabled=page===0;$('next').disabled=page>=pages.length-1;$('pager').classList.toggle('show',view==='pages');document.querySelectorAll('.theme').forEach(b=>b.classList.toggle('active',b.dataset.theme===theme));saveState()}
    ['title','text','font','line','pageCount'].forEach(id=>$(id).addEventListener('input',update));
    $('pageCount').addEventListener('change',()=>{$('pageCount').value=wantedPages();page=0;update()});
    $('themes').addEventListener('click',e=>{const b=e.target.closest('[data-theme]');if(b){theme=b.dataset.theme;update()}});
    document.querySelector('.view-switch').addEventListener('click',e=>{if(!e.target.dataset.view)return;view=e.target.dataset.view;page=0;document.querySelectorAll('.view-switch button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));update()});
    $('langSwitch').addEventListener('click',e=>{if(!e.target.dataset.lang||e.target.dataset.lang===lang)return;lang=e.target.dataset.lang;applyLanguage()});
    $('prev').onclick=()=>{page--;update()};$('next').onclick=()=>{page++;update()};$('importBtn').onclick=()=>$('file').click();
    $('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{$('text').value=String(r.result||'');if(!$('title').value)$('title').value=f.name.replace(/\.txt$/i,'');update();$('notice').textContent=tr().imported(f.name)};r.readAsText(f);e.target.value=''};
    function wrap(ctx,text,max){const out=[],noStart='\uff0c\u3002\uff01\uff1f\uff1b\uff1a\u3001\uff09\u300b\u3011\u300d\u300f\u2019\u201d\uff05\u2026',noEnd='\uff08\u300a\u3010\u300c\u300e\u201c\u2018';for(const raw of text.replace(/\r/g,'').split('\n')){if(!raw.trim()){out.push('');continue}const isCJK=/[\u3400-\u9fff]/.test(raw),prefix=isCJK?'\u3000\u3000':'';let line='';for(const ch of Array.from(prefix+raw.trim())){const next=line+ch;if(line&&ctx.measureText(next).width>max){if(noStart.includes(ch)){line+=ch;continue}let carry='';if(noEnd.includes(line.slice(-1))){carry=line.slice(-1);line=line.slice(0,-1)}if(line)out.push(line);line=carry+ch}else line=next}if(line)out.push(line)}return out}
    function diamond(ctx,x,y,color,size){ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.fillStyle=color;ctx.fillRect(-size/2,-size/2,size,size);ctx.restore()}
    function canvasFor(lines,height,n,total){const s=tr(),W=1080,t=THEMES[theme],c=document.createElement('canvas');c.width=W;c.height=height;const x=c.getContext('2d'),font=+$('font').value,leading=+$('line').value;x.fillStyle=t.paper;x.fillRect(0,0,W,height);x.strokeStyle=t.border;x.lineWidth=2;x.strokeRect(34,34,W-68,height-68);x.globalAlpha=.55;x.lineWidth=1;x.strokeRect(46,46,W-92,height-92);x.globalAlpha=1;diamond(x,W/2,108,t.accent,12);x.fillStyle=t.accent;x.textAlign='center';x.font='18px Arial';x.fillText(s.canvasKicker,W/2,160);x.fillStyle=t.ink;x.font='52px KaiTi, STKaiti, SimSun, serif';x.fillText($('title').value||s.untitled,W/2,232,820);x.strokeStyle=t.border;x.beginPath();x.moveTo(445,278);x.lineTo(635,278);x.stroke();diamond(x,W/2,278,t.accent,8);const lp=Math.round(font*leading);x.fillStyle=t.ink;x.textAlign='left';x.font=`${font}px SimSun, STSong, serif`;let y=354;for(const line of lines){if(line)x.fillText(line,100,y);y+=lp}const fy=height-72;x.strokeStyle=t.border;x.beginPath();x.moveTo(90,fy-22);x.lineTo(990,fy-22);x.stroke();x.fillStyle=t.accent;x.font='18px Arial';x.textAlign='left';x.fillText(s.previewFooter,90,fy+5);x.textAlign='right';x.fillText(n?`${String(n).padStart(2,'0')} / ${String(total).padStart(2,'0')}`:'\u2766',990,fy+5);return c}
    const filename=s=>(s.replace(/[\\/:*?"<>|]/g,'').trim().slice(0,36)||tr().defaultFilename);
    function canvasBlob(c){return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('Image generation failed')),'image/png'))}
    function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
    async function save(c,name){downloadBlob(await canvasBlob(c),name)}
    const CRC_TABLE=(()=>{const table=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;table[n]=c>>>0}return table})();
    function crc32(data){let c=0xffffffff;for(const byte of data)c=CRC_TABLE[(c^byte)&255]^(c>>>8);return(c^0xffffffff)>>>0}
    function makeZip(files){const enc=new TextEncoder(),locals=[],centrals=[];let offset=0,centralSize=0;for(const file of files){const name=enc.encode(file.name),data=file.data,crc=crc32(data),local=new Uint8Array(30),lv=new DataView(local.buffer);lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0x0800,true);lv.setUint16(8,0,true);lv.setUint32(14,crc,true);lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);lv.setUint16(26,name.length,true);locals.push(local,name,data);const central=new Uint8Array(46),cv=new DataView(central.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);cv.setUint16(10,0,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,name.length,true);cv.setUint32(42,offset,true);centrals.push(central,name);offset+=local.length+name.length+data.length;centralSize+=central.length+name.length}const end=new Uint8Array(22),ev=new DataView(end.buffer);ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,centralSize,true);ev.setUint32(16,offset,true);return new Blob([...locals,...centrals,end],{type:'application/zip'})}
    async function exportPic(mode){const s=tr();if(!$('text').value.trim()){$('notice').textContent=s.enterFirst;return}const btns=[$('longBtn'),$('pagesBtn'),$('batchBtn')];btns.forEach(b=>b.disabled=true);$('notice').textContent=s.generating;try{await document.fonts.ready;const layout=layoutText($('text').value),lines=layout.lines,chunks=layout.chunks,name=filename($('title').value),height=Math.max(1440,354+lines.length*layout.lp+135),pageHeight=layout.pageHeight;if(mode==='long'){if(height>MAX_LONG_HEIGHT){view='pages';page=0;document.querySelectorAll('.view-switch button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));update();$('notice').textContent=s.tooLong(chunks.length);return}await save(canvasFor(lines,height),`${name}-${s.longSuffix}.png`);$('notice').textContent=s.longDone(height)}else{if(pageHeight>MAX_LONG_HEIGHT){$('notice').textContent=s.pageTooLong;return}const i=Math.min(page,chunks.length-1);await save(canvasFor(chunks[i],pageHeight,i+1,chunks.length),`${name}-${String(i+1).padStart(2,'0')}.png`);$('notice').textContent=s.pageDone(i+1,chunks.length,pageHeight)}}catch(e){$('notice').textContent=s.generationFailed}finally{btns.forEach(b=>b.disabled=false)}}
    async function exportBatch(){const s=tr();if(!$('text').value.trim()){$('notice').textContent=s.enterFirst;return}const btns=[$('longBtn'),$('pagesBtn'),$('batchBtn')];btns.forEach(b=>b.disabled=true);try{await document.fonts.ready;const layout=layoutText($('text').value),chunks=layout.chunks,name=filename($('title').value);if(layout.pageHeight>MAX_LONG_HEIGHT){$('notice').textContent=s.pageTooLong;return}const files=[];for(let i=0;i<chunks.length;i++){$('notice').textContent=s.genPage(i+1,chunks.length);const blob=await canvasBlob(canvasFor(chunks[i],layout.pageHeight,i+1,chunks.length));files.push({name:`${name}-${String(i+1).padStart(2,'0')}.png`,data:new Uint8Array(await blob.arrayBuffer())})}$('notice').textContent=s.creatingZip;downloadBlob(makeZip(files),lang==='zh'?`${name}-${chunks.length}${s.pagesSuffix}.zip`:`${name}-${chunks.length}-${s.pagesSuffix}.zip`);$('notice').textContent=s.zipDone(chunks.length)}catch(e){$('notice').textContent=s.batchFailed}finally{btns.forEach(b=>b.disabled=false)}}
    $('longBtn').onclick=()=>exportPic('long');$('pagesBtn').onclick=()=>exportPic('page');$('batchBtn').onclick=exportBatch;applyLanguage();
  </script>
